<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Learning Lite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../../assets/css/ui-polish.css" />
  <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="ui-grid-bg min-h-screen flex items-center justify-center px-4 py-10">
  <div id="toast" class="fixed top-5 right-5 z-50 hidden px-4 py-3 rounded-xl shadow-lg text-white transition-all duration-300"></div>

  <a href="../../../index.html" class="fixed top-5 left-5 z-40 inline-flex items-center gap-2 rounded-xl bg-white/90 border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-white transition">
    ← Kembali ke Beranda
  </a>

  <div class="ui-panel ui-glow rounded-3xl overflow-hidden max-w-4xl w-full grid md:grid-cols-2">
    
    <!-- Left Section -->
    <div class="hidden md:flex flex-col items-center justify-center bg-gradient-to-br from-blue-700 via-blue-600 to-cyan-600 text-white p-10">
      <h2 class="text-3xl font-bold mb-4">Welcome Back</h2>
      <p class="text-sm text-center text-blue-100">
        Login untuk lanjut belajar, cek progress, dan akses materi terbaru kamu.
      </p>
      <img src="../../../assets/img/login.png" alt="Login Illustration" class="mt-8 rounded-xl shadow-2xl">
    </div>

    <!-- Login Form -->
    <div class="p-8 md:p-12 bg-white/90">
      <h2 class="text-2xl font-bold text-gray-800 mb-2 text-center">Sign In</h2>
      <p class="text-sm text-center text-slate-500 mb-6">Masukkan email dan password akun kamu</p>
      
      <form action="../../../includes/procces/login.php" method="POST" class="space-y-5">
        
        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-600">Email</label>
          <div class="relative mt-1">
            <input type="email" id="email" name="email" required
              placeholder="example@gmail.com"
              class="w-full pl-10 pr-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" />
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
              <i data-feather="mail"></i>
            </div>
          </div>
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-600">Password</label>
          <div class="relative mt-1">
            <input type="password" id="password" name="password" required
              placeholder="********"
              class="w-full pl-10 pr-10 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" />
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
              <i data-feather="lock"></i>
            </div>
            <div class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 cursor-pointer" onclick="togglePassword()">
              <i id="eyeIcon" data-feather="eye"></i>
            </div>
          </div>
        </div>

        <!-- Remember & Forgot -->
        <div class="flex items-center justify-between">
          <label class="flex items-center text-sm text-gray-600">
            <input type="checkbox" class="mr-2 rounded border-gray-300" />
            Remember Me
          </label>
          <a href="../lupa-password/index.php" class="text-sm text-blue-600 hover:underline">
            Forgot Password?
          </a>
        </div>

        <!-- Button -->
        <button type="submit" class="w-full py-2.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition-all font-semibold">
          Sign In
        </button>

        <!-- Register -->
        <p class="text-center text-sm text-gray-500">
          Don’t have an account?
          <a href="../../auth/register/register.html" class="text-blue-600 hover:underline">
            Register Now
          </a>
        </p>
      </form>
    </div>
  </div>

  <script>
    feather.replace();

    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.setAttribute('data-feather', 'eye-off');
      } else {
        passwordInput.type = 'password';
        eyeIcon.setAttribute('data-feather', 'eye');
      }
      feather.replace();
    }

    function showToast(message, color = 'green') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `fixed top-5 right-5 z-50 px-4 py-3 rounded-xl shadow-lg text-white bg-${color}-500 opacity-0`;
  
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('opacity-100'), 10);
  
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        setTimeout(() => toast.classList.add('hidden'), 300);
      }, 3000);
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('sukses')) {
      const message = {
        'login_berhasil': 'Login successful! Welcome back.'
      }[urlParams.get('sukses')] || 'Success!';
      showToast(message, 'green');
    } else if (urlParams.has('error')) {
      const message = {
        'incorrect_password': 'Incorrect password!',
        'user_not_found': 'Account not found!',
        'invalid_role': 'Your account role is not valid.',
        'access_denied': 'Access denied for this page.',
        'superadmin_only': 'Only superadmin can access this dashboard.',
        'password_salah': 'Incorrect password!',
        'akun_tidak_ditemukan': 'Account not found!',
      }[urlParams.get('error')] || 'An error occurred.';
      showToast(message, 'red');
    }
  </script>
</body>
</html>
